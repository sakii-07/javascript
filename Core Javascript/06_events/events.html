<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #correctMsg, #correctMsg2, #correctMsg3{
            color: green;
        }
         #incorrectMsg, #incorrectMsg2, #incorrectMsg3{
            color: red;
        }
        form{
            width: 500px;
            padding: 10px;
            border-radius: 20px;
            margin: 100px auto;
            border: 2px solid black;
        }
        input{
            width: 250px;
            height: 25px;
            font-size: 20px;
            margin: 5px 0px 5px 15px;
            display: inline;
        }
        label{
            font-size: 20px;
            display: inline;   
            margin-left: 10px; 
        }
        button{
            text-align: center;
            border: none;
            border: 2px solid black;
            border-radius: 10px;
            padding: 8px 20px;
            margin: 10px 10px 10px 200px;
        }
    </style>
</head>
<body>
    
    <form action="">
        <label for="">First Name :</label>
        <input type="text" id="inp1" placeholder="Enter first name here" onkeyup="checkChar()">
        <span id="correctMsg"></span>
        <span id="incorrectMsg"></span>
        <br>
         <label for=""> Last Name :</label>
        <input type="text" id="inp2" placeholder="Enter last name here" onkeyup="checkChar2()">
        <span id="correctMsg2"></span>
        <span id="incorrectMsg2"></span>

        <br>
        <label for=""> Password :</label>
        <input type="password" id="inp3" placeholder="Enter password here" onkeyup="checkPass()">
        <span id="correctMsg3"></span>
        <span id="incorrectMsg3"></span>
        
        <br>
        <label for=""> Mobile No :</label>
        <input type="text" id="inp4" placeholder="Enter Mobile Number here" onkeyup="checkMoNo()" maxlength="10" minlength="10">
        <span style="color: green;" id="correctMsg4"></span>
        <span style="color: red;" id="incorrectMsg4"></span>
        <br>
        <button>submit</button>
    </form>
    <script src="events.js"></script>
</body>
</html>
