<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Element</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script></head>

</head>
<body>

    <!-- Set element means changing or updating the content of an HTML element.
    .html("data") is used to set HTML content inside an element.
    Example:
    $("#head").html("This is heading") sets text inside <h1>.

    .val("data") is used to set value in input fields.
      Example:
    $("#inp").val(name) sets input value dynamically.

    Data from one element can be set into another element.
    Set methods replace the previous content or value.
    jQuery makes setting elements easy with short syntax. -->

    <h1 id="head"></h1>

    <script>
        $(document).ready(function () {
            
            $("#head").html("This is heading")
        })
    </script>

    <!-- set element to the input -->

    
    <h1 id="head1">sakshi</h1>

    <input type="text" id="inp">
    <script>
        $(document).ready(function(){
            var name = $("#head1").html()
            $("#inp").val(name)
        })
    </script>
    
</body>
</html>
