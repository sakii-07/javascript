<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>get Element</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script></head>
<body>

    <!-- document.getElementById("head") is used in JavaScript to get an element by its id.
    $("#head") is used in jQuery to get an element by its id.
    JavaScript returns a DOM object, but jQuery returns a jQuery object.
    .innerHTML in JavaScript is used to get or set HTML content of an element.
    .html() in jQuery is used to get or set HTML content.
    .value in JavaScript is used to get or set the value of an input field.
    .val() in jQuery is used to get or set the value of an input field.
    $(document).ready() ensures the code runs after the page is fully loaded.
    jQuery syntax is shorter and easier compared to JavaScript. -->


    <h1 id="head">This is heading</h1>

    <input type="text" id="inp" value="sam">

    <script>
        $(document).ready(function(){

            // In javascript - To get element
            var a = document.getElementById("head");
            console.log(a);
            

            // In jQuery - To get element
            var b = $("#head")
            console.log(b);


            // In javascript - To get element data
            var a = document.getElementById("head").innerHTML;
            console.log(a);
            

            // In jQuery - To get element data
            var b = $("#head").html()
            console.log(b);

            // In javascript - To get element data from input
            var a = document.getElementById("inp").value;
            console.log(a);
            

            // In jQuery - To get element data from input
            var b = $("#inp").val()
            console.log(b);

        })
    </script>
    
</body>
</html>
