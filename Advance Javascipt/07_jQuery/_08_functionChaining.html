<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>function Chaining</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

    <!-- Function chaining means calling multiple methods on the same element in a single line.

        In jQuery, most methods return the same object, so we can chain them.

        It reduces code length and makes code cleaner.

        Syntax:
        $("selector").method1().method2().method3(); -->

    <h1 id="head">This is heading!</h1>

    <script>

        $(document).ready(function () {

            $("#head").slideUp(3000).slideDown(2000).css({"color":"red"})
            
        })
    </script>
    
</body>
</html>
