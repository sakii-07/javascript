<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

    <div class="container mt-5 col-7">
    <div class="card shadow p-4">
        <h3 class="text-center mb-4">Registration Form</h3>

        <form>
        <!-- Full Name -->
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" placeholder="Enter your name" id="inp1">
            <p  style="color: red;" id="errorMsg1"></p>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" placeholder="Enter your email" id="inp2">
            <p style="color: red;" id="errorMsg2"></p>
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" placeholder="Enter password" id="inp3">
            <p style="color: red;" id="errorMsg3"></p>
        </div>

        <!-- Phone -->
        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="tel" class="form-control" placeholder="Enter phone number" id="inp4">
            <p style="color: red;" id="errorMsg4"></p>
        </div>

        <!-- Message -->
        <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea class="form-control" rows="3" placeholder="Enter your message" id="inp5"></textarea>
            <p style="color: red;" id="errorMsg5"></p>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary w-100" id="btn">Submit</button>
        </form>

        <div class="container mt-5 ">
            <div class="card shadow p-4">
                <h4 id="head1"></h4>
                <h4 id="head2"></h4>
                <h4 id="head3"></h4>
                <h4 id="head4"></h4>
                <h4 id="head5"></h4>
            </div>
        </div>

    </div>
    </div>

        <script>
            $(document).ready(function () {

                $("#inp1").on("keyup", function(){

                    var checkChar = /^[A-Za-z\s]+$/;
                    var name =  $("#inp1").val()

                    if (name.match(checkChar)){
                        $("#errorMsg1").html("")
                    }else{
                        $("#errorMsg1").html("Enter valid name")
                    }
                    
                });

                $("#inp2").on("keyup", function(){

                    var checkEmail = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
                    var email =  $("#inp2").val()

                    if (email.match(checkEmail)){
                        $("#errorMsg2").html("")
                    }else{
                        $("#errorMsg2").html("Enter valid email address")
                    }
                     
                }); 

                $("#inp3").on("keyup", function(){

                    var checkpass = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/; 
                    var pass =  $("#inp3").val()

                    if (pass.match(checkpass)){
                         $("#errorMsg3").html("")
                    }else{
                        $("#errorMsg3").html("Password must be 8+ characters, include uppercase, lowercase, number and special character.")
                    }
                     
                });

            $("#inp4").on("keyup", function(){

                    var checkMoNo = /^[6-9][0-9]{9}$/;
                    var moNo =  $("#inp4").val()

                    if (moNo.match(checkMoNo)){
                        $("#errorMsg4").html("")
                    }else{
                        $("#errorMsg4").html("Enter valid 10 digit mobile number")
                    }
                
                    
                });

                $("#inp5").on("keyup", function(){

                    var checkMsg = /^[A-Za-z0-9\s.,!?'-]{5,}$/;
                    var msg =  $("#inp5").val()

                    if (msg.match(checkMsg)){
                         $("#errorMsg5").html("")
                    }else{
                        $("#errorMsg5").html("Message must be at least 5 characters")
                    }
                    
                });
                 $("#btn").on("click", function (e) {
                    e.preventDefault();
                    var name =  $("#inp1").val()
                    $("#head1").html(name)
                    var email =  $("#inp2").val()
                    $("#head2").html(email)
                    var pass =  $("#inp3").val()
                    $("#head3").html(pass)
                    var moNo =  $("#inp4").val()
                    $("#head4").html(moNo) 
                    var msg =  $("#inp5").val() 
                    $("#head5").html(msg)
                });
            });

               
        </script>
    
</body>
</html>
