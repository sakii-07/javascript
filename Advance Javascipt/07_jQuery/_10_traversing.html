    <!-- 📌 Traversing :-

        Traversing means moving through HTML elements in the DOM.

        It is used to find parent, child, or sibling elements.

        jQuery provides many methods for traversing.

        📌 Parent Methods :-

        .parent() selects the immediate parent element.

        .parents() selects all ancestor elements.

        .parentsUntil() selects ancestors up to a specified element.


        📌 Child Traversing (Move Down) :-

        .children() selects all direct child elements.

        .find() selects all descendant elements.


        📌 Sibling Methods :-

        .siblings() selects all sibling elements.

        .next() selects the next sibling element.

        .nextAll() selects all next sibling elements.

        .nextUntil() selects next siblings until a specified element.

        .prev() selects the previous sibling element.

        .prevAll() selects all previous sibling elements.

        .prevUntil() selects previous siblings until a specified element.


        📌 Filtering Methods :-

        .first() selects the first matched element.

        .last() selects the last matched element.

        .eq(index) selects element by index number.

        .filter() selects elements that match a condition.

        .not() removes elements that match a condition.


        📌 Important Points :-

        Traversing helps to move up, down, or sideways in the DOM tree.

        It is mainly used for selecting related elements easily.

        jQuery makes DOM traversal simple with short methods. -->
